[project]
name = "physiguard"
version = "0.1.0"
description = "Cyber-physical integrity prototype for EV charging"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx2",
]
lint = [
    "ruff>=0.5",
]
typecheck = [
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
plot = ["matplotlib>=3.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["physiguard*"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]  # line too long, handled by formatter
fixable = ["ALL"]
unfixable = ["T201"]  # print statements

[tool.ruff.lint.isort]
known-first-party = ["physiguard"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_any_generics = true
python_version = "3.11"
namespace_packages = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow",
    "unit: unit tests",
    "integration: integration tests",
]

      <use href="#tree" x="35" y="36" transform="scale(.9)"/>
      <use href="#tree" x="117" y="29" transform="scale(1.2)"/>
      <use href="#tree" x="192" y="61" transform="scale(.72)"/>
      <use href="#tree" x="75" y="119" transform="scale(1.1)"/>
      <use href="#tree" x="177" y="145" transform="scale(1.05)"/>
      <use href="#tree" x="17" y="167" transform="scale(.64)"/>
      <path d="M0 93Q55 75 98 91T230 80V112Q172 129 112 108T0 124Z" fill="#8b8a4b" opacity=".12"/>
    </pattern>

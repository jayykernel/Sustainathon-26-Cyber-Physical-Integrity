<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ground" x2="0" y2="1">
      <stop stop-color="#758657"/>
      <stop offset=".48" stop-color="#4e6748"/>
      <stop offset="1" stop-color="#304735"/>
    </linearGradient>
    <linearGradient id="road" x2="1">
      <stop stop-color="#929b8f"/>
      <stop offset=".5" stop-color="#c5c5b5"/>
      <stop offset="1" stop-color="#849083"/>
    </linearGradient>
    <radialGradient id="canopy">
      <stop stop-color="#9aa96c"/>
      <stop offset=".68" stop-color="#627b4e"/>
      <stop offset="1" stop-color="#364d38"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .042" numOctaves="3" seed="12"/>
      <feColorMatrix values=".28 0 0 0 .08 .28 0 0 0 .12 .28 0 0 0 .08 0 0 0 .18 0"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
